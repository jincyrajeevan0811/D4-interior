<div class="field{% if f.errors %} field--error{% endif %}{% if wide %} field--wide{% endif %}">
  <label for="{{ f.id_for_label }}">{{ f.label }}{% if f.field.required %} <span class="req" aria-hidden="true">*</span>{% endif %}</label>
  {{ f }}
  {% if f.help_text and show_help %}<p class="hint">{{ f.help_text }}</p>{% endif %}
  {% for e in f.errors %}<p class="field__error">{{ e }}</p>{% endfor %}
</div>
