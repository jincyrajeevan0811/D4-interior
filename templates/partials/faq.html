{% if faqs %}
<div class="faq">
  {% for f in faqs %}
  <details class="faq__item" {% if forloop.first and open_first %}open{% endif %}>
    <summary>{{ f.question }}<span class="faq__icon" aria-hidden="true"></span></summary>
    <div class="faq__answer">{{ f.answer|linebreaks }}</div>
  </details>
  {% endfor %}
</div>
{% endif %}
